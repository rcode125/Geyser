name: Build Geyser

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Geyser
        run: ./gradlew build

      - name: Copy compiled JAR
        run: |
          mkdir -p compiled
          rm -f compiled/*.jar
          cp bootstrap/spigot/build/libs/*.jar compiled/

      - name: Commit compiled JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add compiled/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build Geyser"
            git push
          fi
